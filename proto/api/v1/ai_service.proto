syntax = "proto3";

package api.v1;

option go_package = "github.com/kartverket/skipctl/pkg/api/v1;apiv1";

// The AI service definition.
service AIService {
  // Refactor a file to Argokit v2 with Vertex AI
  rpc RefactorToArgokitv2(stream RefactorToArgokitv2Request) returns (RefactorToArgokitv2Response);
}

// Request message for streaming file upload
message RefactorToArgokitv2Request {
  // File chunk data
  bytes chunk = 1;
  // File name (sent in first chunk)
  string file_name = 2;
  // MIME type (sent in first chunk)
  string mime_type = 3;
  // Analysis prompt (sent in first chunk)
  string prompt = 4;
}

// Response message for file analysis
message RefactorToArgokitv2Response {
  // AI-generated response
  string response = 1;
}